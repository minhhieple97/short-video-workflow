      <g transform="translate(400 268)"><rect width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/><text x="46" y="20" fill="#ffffff">Voice</text></g>
